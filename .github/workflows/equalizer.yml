name: Equalizer

on:
  schedule:
    # GitHub's minimum interval; runs may be delayed at busy times.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: equalizer
  cancel-in-progress: false

env:
  IMAGE: kiwitcms/kiwitcms
  TAG: latest

jobs:
  compare:
    name: Compare pull counts
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    outputs:
      needs_download: ${{ steps.counts.outputs.needs_download }}
    steps:
      - name: Compare kiwitcms/kiwitcms against kiwitcms/kiwi
        id: counts
        run: |
          set -euo pipefail

          current="$(curl -fsS https://hub.docker.com/v2/repositories/kiwitcms/kiwitcms/ 2>/dev/null | jq -r '.pull_count // 0' || true)"
          target="$(curl -fsS https://hub.docker.com/v2/repositories/kiwitcms/kiwi/ 2>/dev/null | jq -r '.pull_count // 0' || true)"
          current="${current:-0}"
          target="${target:-0}"

          echo "kiwitcms/kiwitcms: ${current} pulls"
          echo "kiwitcms/kiwi:     ${target} pulls"

          if [ "${current}" -lt "${target}" ]; then
            echo "needs_download=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_download=false" >> "$GITHUB_OUTPUT"
          fi

  download:
    name: Pull manifest 50 times
    needs: compare
    if: needs.compare.outputs.needs_download == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 4
    steps:
      - name: GET the Docker manifest 50 times
        run: |
          set -euo pipefail

          auth_url="https://auth.docker.io/token?service=registry.docker.io&scope=repository:${IMAGE}:pull"
          token="$(curl -fsS "${auth_url}" | jq -r .token)"

          for i in $(seq 1 50); do
            # A manifest GET is what Docker Hub counts as a pull; HEAD is not counted.
            curl -fsS -X GET \
              -H "Authorization: Bearer ${token}" \
              -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json" \
              -o /dev/null \
              "https://registry-1.docker.io/v2/${IMAGE}/manifests/${TAG}"

            sleep 2

            if [ $((i % 10)) -eq 0 ]; then
              echo "${i}/50 manifest GETs completed"
            fi
          done

  manage-help:
    name: Run manage.py help in the container
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    container:
      image: kiwitcms/kiwitcms:latest
    steps:
      - name: manage.py help
        run: /Kiwi/manage.py help
